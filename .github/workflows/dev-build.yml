# main에 합쳐질 때마다 개발 빌드를 만들어 고정 태그 "dev"의 프리릴리스로 올린다(이전 개발 빌드는 지운다).
# 앱 설정에서 업데이트 채널을 "최신 개발 버전"으로 고른 사용자만 이 빌드를 받는다.
# 버전은 <csproj Version>.<실행 번호> (예: 1.0.0.45). 정식 릴리스는 scripts/publish.ps1 -Publish로 따로 만든다.
name: Dev build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  dev-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package
        shell: pwsh
        run: ./scripts/publish.ps1 -BuildNumber ${{ github.run_number }}

      - name: Publish dev pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem release/HearingAid-*-win-x64.zip | Select-Object -First 1
          gh release delete dev --cleanup-tag --yes
          if ($LASTEXITCODE -ne 0) { Write-Host "이전 개발 빌드 없음" }
          $notes = "main@${{ github.sha }} 에서 자동으로 만든 개발 빌드입니다. 정식 릴리스가 아니며 문제가 있을 수 있습니다."
          gh release create dev $zip.FullName --prerelease --target ${{ github.sha }} --title "개발 빌드 $($zip.BaseName)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
